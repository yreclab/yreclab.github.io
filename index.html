      <script type="text/javascript">
      var worker = new Worker('worker.js');
      outdata = {}
      outdata["track"] = "";
      outdata["last"] = "";
      outdata["full"] = "";
      outdata["store"] = "";
      outdata["short"] = "";
      viewingfile = "last";
      structcoord1 = "mass";
      structcoord2 = "radius";
      //yrec_process = 0;
      yrec_paused = 0;
      
      nml1files = [];
      nml2files = [];
  
	  var date = new Date();
	  time_fname = date.getTime();
	  
	  function set_nml1_lists(nml1files) {
		  selectnml1 = document.getElementById("listnml1");
		  selectnml1.innerHTML = "";
		  if (true) {
			  const option = document.createElement("option");
			  option.value = "";
			  option.textContent = "Control Namelists";
			  option.selected = true;
			  selectnml1.appendChild(option);
		  }
		  for (const item of nml1files) {
			  const option = document.createElement("option");
			  var itemlen = item.split("/").length
			  option.value = item;
			  option.textContent = item.split("/")[itemlen-1];
			  selectnml1.appendChild(option);
		  }
	  }
	  
	  function set_nml2_lists(nml2files) {
		  selectnml2 = document.getElementById("listnml2");
		  selectnml2.innerHTML = "";
		  if (true) {
			  const option = document.createElement("option");
			  option.value = "";
			  option.textContent = "Physics Namelists";
			  option.selected = true;
			  selectnml2.appendChild(option);
		  }
		  for (const item of nml2files) {
			  const option = document.createElement("option");
			  var itemlen = item.split("/").length
			  option.value = item;
			  option.textContent = item.split("/")[itemlen-1];
			  selectnml2.appendChild(option);
		  }
	  }
	  
	  function get_folder(value) {
		  var valuelen = value.split("/").length
		  return value.split("/").slice(0, valuelen-1).join("/")
	  }
	  
	  function only_unique(value, index, array) {
		  return array.indexOf(value) === index;
	  }
	  
	  function new_folder_selected() {
		  var selectfolder = document.getElementById("folder");
		  selected_folder = selectfolder.value;
		  var current_nml1s = []
		  for (var idx_nml1 = 0; idx_nml1 < nml1files.length; idx_nml1++){
			  if(nml1files[idx_nml1].indexOf(selected_folder) !== -1){
				  current_nml1s.push(nml1files[idx_nml1])
			  }
		  }
		  var current_nml2s = []
		  for (var idx_nml2 = 0; idx_nml2 < nml2files.length; idx_nml2++){
			  if(nml2files[idx_nml2].indexOf(selected_folder) !== -1){
				  current_nml2s.push(nml2files[idx_nml2])
			  }
		  }
		  set_nml1_lists(current_nml1s);
		  set_nml2_lists(current_nml2s);
		  
		  document.getElementById('listnml1').disabled = false;
		  document.getElementById('listnml2').disabled = false;
	  }
	  
      worker.addEventListener('message', function(e) {
		  //console.log("EVENT", e.data);
		  document.getElementById("loader").style.display = 'none';
		  if(e.data.split("|")[0] == "ready"){
			  worker.postMessage("get_nml1|");
			  worker.postMessage("get_nml2|");
			  worker.postMessage("list_nml1|templates");
			  worker.postMessage("list_nml2|templates");
		  }
		  if(e.data.split("|")[0] == "chain" && yrec_paused == 0){
			  worker.postMessage("chain");
		  }
		  if(e.data.split("|")[0] == "nml1"){
			  document.getElementById("nml1").value = e.data.split("|")[1];
		  }
		  if(e.data.split("|")[0] == "nml2"){
			  document.getElementById("nml2").value = e.data.split("|")[1];
		  }
		  if(e.data.split("|")[0] == "track"){
			  outdata["track"] = e.data.split("|")[1];
			  if (viewingfile == 'track'){
				  document.getElementById("outputview").value = outdata["track"];
			  }
			  refreshplot1();
		  }
		  if(e.data.split("|")[0] == "last"){
			  outdata["last"] = e.data.split("|")[1];
			  if (viewingfile == 'last'){
				  document.getElementById("outputview").value = outdata["last"];
			  }
			  refreshplot2();
			  refreshplot3();
		  }
		  if(e.data.split("|")[0] == "full"){
			  outdata["full"] = e.data.split("|")[1];
			  if (viewingfile == 'full'){
				  document.getElementById("outputview").value = outdata["full"];
			  }
		  }
		  if(e.data.split("|")[0] == "store"){
			  outdata["store"] = e.data.split("|")[1];
			  if (viewingfile == 'store'){
				  document.getElementById("outputview").value = outdata["store"];
			  }
		  }
		  if(e.data.split("|")[0] == "short"){
			  outdata["short"] = e.data.split("|")[1];
			  if (viewingfile == 'short'){
				  document.getElementById("outputview").value = outdata["short"];
			  }
		  }
		  if(e.data.split("|")[0] == "list_nml1"){
			  nml1files = e.data.split("|")[1].split(',');
			  selectnml1 = document.getElementById("listnml1");
			  selectnml1.innerHTML = "";
			  
			  unique_folders = nml1files.map(get_folder).filter(only_unique);
			  
			  selectfolder = document.getElementById("folder");
			  selectfolder.innerHTML = "";
			  if (true) {
				  const option = document.createElement("option");
				  option.value = "";
				  option.textContent = "Control Namelists";
				  option.selected = true;
				  selectnml1.appendChild(option);
			  }
			  if (true) {
				  const option = document.createElement("option");
				  option.value = "";
				  option.textContent = "Namelist Folders";
				  option.selected = true;
				  selectfolder.appendChild(option);
			  }
			  for (const item of unique_folders) {
				  const option = document.createElement("option");
				  option.value = item;
				  option.textContent = item.split("/").slice(1).join("/");
				  selectfolder.appendChild(option);
			  }
		  }
		  if(e.data.split("|")[0] == "list_nml2"){
			  nml2files = e.data.split("|")[1].split(',');
			  selectnml2 = document.getElementById("listnml2");
			  selectnml2.innerHTML = "";
			  if (true) {
				  const option = document.createElement("option");
				  option.value = "";
				  option.textContent = "Physics Namelists";
				  option.selected = true;
				  selectnml2.appendChild(option);
			  }
		  }
		  if(e.data.split("|")[0] == "error"){
			  document.getElementById('run').setAttribute('disabled', 'disabled');
			  document.getElementById('step').setAttribute('disabled', 'disabled');
			  document.getElementById('pause').setAttribute('disabled', 'disabled');
			  document.getElementById("loader").style.display = 'none';
			  document.getElementById("errored").style.display = '';
			  document.getElementById("error_message").style.display = '';
			  document.getElementById("error_message").textContent = "Error: " + e.data.split("|")[1];
		  }
	  });
	  
	  /*function start_yrec_run(){
		  yrec_process = setInterval("worker.postMessage('step')", 2000)
	  }
	  
	  function stop_yrec_run(){
		  clearInterval(yrec_process);
	  }*/
	  
	  function new_nml1_selected(){
		  const select_nml1 = document.getElementById("listnml1");
		  const value = select_nml1.value;
		  if (value.length > 0){
			  worker.postMessage("read_nml1|"+value);
		  }
		  
		  var valuelen = value.split(".").length
		  var value_as_nml2 = value.split(".").slice(0, valuelen-1).join(".") + ".nml2"
		  if (nml2files.indexOf(value_as_nml2) !== -1){
			  const select_nml2 = document.getElementById("listnml2");
			  select_nml2.value = value_as_nml2;
			  if (value_as_nml2.length > 0){
				  worker.postMessage("read_nml2|"+value_as_nml2);
			  }
		  }
	  }
	  
	  function new_nml2_selected(){
		  const select_nml2 = document.getElementById("listnml2");
		  const value = select_nml2.value;
		  if (value.length > 0){
			  worker.postMessage("read_nml2|"+value);
		  }
		  
		  var valuelen = value.split(".").length
		  var value_as_nml1 = value.split(".").slice(0, valuelen-1).join(".") + ".nml1"
		  if (nml1files.indexOf(value_as_nml1) !== -1){
			  const select_nml1 = document.getElementById("listnml1");
			  select_nml1.value = value_as_nml1;
			  if (value_as_nml1.length > 0){
				  worker.postMessage("read_nml1|"+value_as_nml1);
			  }
		  }
	  }
	  
	  function set_nml(callback){
		  worker.postMessage("set_nml1|"+document.getElementById("nml1").value);
		  worker.postMessage("set_nml2|"+document.getElementById("nml2").value);
		  setTimeout(callback, 5000);
	  }
	  
	  function step_yrec_run(){
		  document.getElementById("loader").style.display = '';
		  yrec_paused = 0;
		  worker.postMessage("step");
		  document.getElementById("nml1").setAttribute('readonly', true);
		  document.getElementById("nml2").setAttribute('readonly', true);
		  document.getElementById("nml1").setAttribute('disabled', true);
		  document.getElementById("nml2").setAttribute('disabled', true);
	  }
	  
	  function start_yrec_run(){
		  document.getElementById("loader").style.display = '';
		  yrec_paused = 0;
		  worker.postMessage("chain");
		  document.getElementById("nml1").setAttribute('readonly', true);
		  document.getElementById("nml2").setAttribute('readonly', true);
		  document.getElementById("nml1").setAttribute('disabled', true);
		  document.getElementById("nml2").setAttribute('disabled', true);
	  }
	  
	  function stop_yrec_run(){
		  yrec_paused = 1;
	  }
  
		// create a data source to hold data
		const source1 = new Bokeh.ColumnDataSource({
			data: { x: [], y: [] }
		});
		const curr_source1 = new Bokeh.ColumnDataSource({
			data: { x: [], y: [] , z: [] }
		});

		// make a plot with some tools
		const plot1 = Bokeh.Plotting.figure({
			title: 'Hertzsprung-Russell Diagram',
			tools: "pan,wheel_zoom,box_zoom,reset,save",
			height: 390,
			width: 585,

		plot1.ygrid[0].properties.grid_line_color.set_value(null)

		});

		async function plotCSVColumnsBokeh({
			  csvUrl,
			  xCol,
			  yCol,
			  targetId = "plot",
			  delimiter = ","
			}) {
			  // Fetch CSV text
			  const response = await fetch(csvUrl);
			  if (!response.ok) {
				throw new Error(`Failed to load CSV: ${response.status}`);
			  }
			  const text = await response.text();

			  // --- Simple CSV parsing ---
			  const rows = text.trim().split("\n").map(r => r.split(delimiter));
			  const headers = rows[0];

			  const xIndex = headers.indexOf(xCol);
			  const yIndex = headers.indexOf(yCol);

			  if (xIndex === -1 || yIndex === -1) {
				throw new Error("Specified columns not found in CSV headers.");
			  }

			  const x = [];
			  const y = [];

			  for (let i = 1; i < rows.length; i++) {
				const xv = Number(rows[i][xIndex]);
				const yv = Number(rows[i][yIndex]);

				if (!Number.isNaN(xv) && !Number.isNaN(yv)) {
				  x.push(xv);
				  y.push(yv);
				}
			  }
			const thrd = new Bokeh.ColumnDataSource({
				data: { x: x, y: y }
			});

			plot1.line({ field: "x" }, { field: "y" }, {
				source: thrd,
				line_width: 0.25,
				color: 'black'
			});
		}
		
		for (var idx = 0; idx < selected_isos.length; idx++) {
			plotCSVColumnsBokeh({
			  csvUrl: "./yreclab_isos/"+selected_isos[idx][1],
			  xCol: "log_Teff",
			  yCol: "LogL_lsun"
			});
		}
		
		function formatMyrGyr(x, opts = {}) {
		  const { sigFigs = 3, trimTrailingZeros = true } = opts;

		  if (!Number.isFinite(x)) return String(x);

		  const unit = Math.abs(x) >= 1000 ? "Gyr" : "Myr";
		  const value = unit === "Gyr" ? x / 1000 : x;

		  let s = value.toPrecision(sigFigs);

		  if (trimTrailingZeros) {
			if (!/[eE]/.test(s)) {
			  s = s.replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
			}
		  }

		  return `${s} ${unit}`;
		}
